# Isolated, disposable design review environment. Never uses the existing development database.
spring:
  datasource:
    url: jdbc:h2:mem:aica-design-preview;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver
  flyway:
    locations: classpath:db/migration/h2
  thymeleaf:
    cache: false
server:
  address: 127.0.0.1
  port: 8081
backoffice:
  preview: true
  bootstrap:
    enabled: false
