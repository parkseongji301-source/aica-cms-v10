# Persistent, loopback-only development workspace. Never enable this profile on a deployed server.
spring:
  datasource:
    url: jdbc:h2:file:./.local-data/aica-local;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password:
    driver-class-name: org.h2.Driver
  flyway:
    locations: classpath:db/migration/h2
  thymeleaf:
    cache: false
server:
  address: 127.0.0.1
  port: 8081
backoffice:
  preview: true
  bootstrap:
    enabled: false
  local:
    import: .cache/design-preview/content-backup.json

