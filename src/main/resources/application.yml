spring:
  application:
    name: aica-backoffice
  profiles:
    default: dev
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB
  thymeleaf:
    cache: true
server:
  address: 127.0.0.1
  port: 8080
  servlet:
    session:
      timeout: 30m
      cookie:
        http-only: true
        same-site: lax
  error:
    include-message: never
    include-stacktrace: never
    include-binding-errors: never
backoffice:
  versions:
    post-draft-limit: ${BACKOFFICE_POST_DRAFT_VERSIONS:20}
    page-draft-limit: ${BACKOFFICE_PAGE_DRAFT_VERSIONS:20}
    template-limit: ${BACKOFFICE_TEMPLATE_VERSIONS:20}
  time-zone: ${BACKOFFICE_TIME_ZONE:Asia/Seoul}
  bootstrap:
    enabled: ${BACKOFFICE_BOOTSTRAP_ENABLED:false}
    email: ${BACKOFFICE_BOOTSTRAP_EMAIL:}
    name: ${BACKOFFICE_BOOTSTRAP_NAME:최상위 관리자}
    password: ${BACKOFFICE_BOOTSTRAP_PASSWORD:}
