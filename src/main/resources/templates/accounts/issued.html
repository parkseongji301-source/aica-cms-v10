<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('임시 비밀번호 발급')}"></head>
<body class="admin-layout"><header th:replace="~{fragments :: header}"></header><main class="narrow" id="main-content">
  <h1>임시 비밀번호 발급</h1>
  <p>계정: <strong th:text="${credential.email}"></strong></p>
  <p>아래 비밀번호를 계정 사용자에게 전달하세요. 페이지를 다시 열면 표시되지 않습니다.</p>
  <code id="temporary-password" class="credential" th:text="${credential.temporaryPassword}"></code>
  <p class="muted">첫 로그인 후 본인 비밀번호로 변경해야 합니다.</p>
  <a class="button" th:href="@{/admin/legacy/accounts}">계정 목록으로</a>
</main></body></html>
