<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('역할 변경')}"></head>
<body class="admin-layout"><header th:replace="~{fragments :: header}"></header><main class="narrow" id="main-content">
  <h1>계정 역할 변경</h1>
  <p><strong th:text="${account.email}"></strong></p>
  <p>현재 역할: <strong th:text="${account.role.label}"></strong></p>
  <p class="notice">최상위 관리자로 변경하면 계정 관리 권한이 부여됩니다. 변경 후 해당 계정은 다시 로그인해야 합니다.</p>
  <form th:action="@{/admin/accounts/{id}/role(id=${account.id})}" method="post">
    <label for="role">변경할 역할</label><select id="role" name="role" required>
      <option th:each="role : ${roles}" th:value="${role}" th:text="${role.label}" th:selected="${role == account.role}"></option>
    </select>
    <div class="actions"><button type="submit">역할 변경 적용</button><a th:href="@{/admin/accounts}">취소</a></div>
  </form>
</main></body></html>
