<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('역할 / 권한 관리')}"></head>
<body class="admin-layout"><div th:replace="~{fragments :: header}"></div><main class="workspace" id="main-content">
  <div class="page-heading"><div><h1>역할 / 권한 관리</h1></div><a class="button secondary" th:href="@{/admin/accounts}">계정별 역할 변경</a></div>
  <div class="role-grid"><article class="panel role-card" th:each="role : ${roleCards}"><span class="metric-icon blue"><svg class="icon" aria-hidden="true"><use href="#i-shield"></use></svg></span><h2 th:text="${role.label}"></h2><span class="role-code" th:text="${role.code}"></span><ul><li>로그인 및 본인 비밀번호 변경</li><li th:text="${role.allPosts ? '전체 글 조회·등록·수정' : '본인 콘텐츠 조회·등록·수정·초안 저장'}"></li><li th:if="${role.allPosts}">대시보드 방문 통계 조회</li><li th:if="${role.allPosts}">기존 페이지 내용·블록 편집 및 발행</li><li th:if="${role.publish}">콘텐츠 발행·공개 중단</li><li th:unless="${role.publish}">발행·공개 중단·영구 삭제 불가</li><li th:if="${role.structure}">새 페이지·URL·메뉴·사이트 설정·공용 템플릿 관리</li><li th:if="${role.permanentDelete}">영구 삭제</li><li th:if="${role.manageAccounts}">활동 이력 조회</li><li th:if="${role.manageAccounts}">운영 계정 발급 및 역할 변경</li><li th:if="${role.manageAccounts}">계정 비활성화 및 비밀번호 초기화</li></ul></article></div>
  <p class="role-notice">현재 적용된 3개 역할의 권한입니다. 구성원의 역할은 계정 관리에서 변경할 수 있습니다.</p>
  <footer th:replace="~{fragments :: footer}"></footer>
</main></body></html>
