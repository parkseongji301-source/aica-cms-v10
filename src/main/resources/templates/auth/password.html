<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('비밀번호 변경')}"></head>
<body class="admin-layout"><header th:replace="~{fragments :: header}"></header><main class="narrow" id="main-content">
  <h1>본인 비밀번호 변경</h1>
  <p class="notice" th:if="${currentUser.passwordChangeRequired}">임시 비밀번호를 변경한 후 업무 기능을 사용할 수 있습니다.</p>
  <p class="muted">12자 이상, UTF-8 기준 72바이트 이하로 입력하세요. 변경 후 다시 로그인해야 합니다.</p>
  <div th:replace="~{fragments :: messages}"></div>
  <form th:action="@{/account/password}" method="post">
    <label for="currentPassword">현재 비밀번호</label>
    <input id="currentPassword" name="currentPassword" type="password" required autocomplete="current-password">
    <label for="newPassword">새 비밀번호</label>
    <input id="newPassword" name="newPassword" type="password" required minlength="12" maxlength="72" autocomplete="new-password">
    <label for="confirmPassword">새 비밀번호 확인</label>
    <input id="confirmPassword" name="confirmPassword" type="password" required minlength="12" maxlength="72" autocomplete="new-password">
    <button type="submit">비밀번호 변경</button>
  </form>
</main></body></html>
