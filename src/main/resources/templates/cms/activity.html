<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments :: head('활동 이력')}"></head>
<body class="admin-layout"><div th:replace="~{fragments :: header}"></div><main class="workspace" id="main-content">
<div class="page-heading"><div><h1>활동 이력</h1></div></div>
<div th:replace="~{fragments :: messages}"></div>
<section class="panel"><div class="table-summary"><h2>변경 기록</h2><span class="count-pill" th:text="'총 '+${total}+'건'"></span></div><form class="search-form audit-search" th:action="@{/admin/legacy/activity}" method="get"><label class="sr-only" for="audit-q">활동 이력 검색</label><input id="audit-q" name="q" th:value="${query}" maxlength="100" placeholder="작업자·작업·대상 검색"><label class="check-label"><input type="checkbox" name="drafts" value="true" th:checked="${drafts}">임시저장 기록 포함</label><button class="secondary">검색</button></form>
<div class="empty-state" th:if="${#lists.isEmpty(activities)}">표시할 기록이 없습니다.</div><div class="table-wrap" th:unless="${#lists.isEmpty(activities)}"><table><thead><tr><th>일시</th><th>작업자</th><th>작업</th><th>대상</th><th>내용</th></tr></thead><tbody><tr th:each="a : ${activities}"><td th:text="${#temporals.format(a.createdAt,'yyyy.MM.dd HH:mm:ss')}"></td><td th:text="${a.actorName}"></td><td th:text="${a.actionLabel()}"></td><td th:text="${a.targetLabel()}"></td><td th:text="${a.detailLabel()}"></td></tr></tbody></table></div><nav class="pagination"><span>페이지당 30건</span><div><a th:if="${page > 0}" th:href="@{/admin/legacy/activity(page=${page - 1},q=${query},drafts=${drafts})}">이전</a><span th:text="${page + 1}+' 페이지'"></span><a th:if="${(page + 1) * 30 < total}" th:href="@{/admin/legacy/activity(page=${page + 1},q=${query},drafts=${drafts})}">다음</a></div></nav></section><footer th:replace="~{fragments :: footer}"></footer></main></body></html>
