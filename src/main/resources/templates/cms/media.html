<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments :: head('파일 관리')}"></head>
<body class="admin-layout"><div th:replace="~{fragments :: header}"></div><main class="workspace" id="main-content">
<div class="page-heading"><div><h1>파일 관리</h1></div></div>
<div th:replace="~{fragments :: messages}"></div>
<section class="panel form-panel"><form th:action="@{/admin/media}" method="post" enctype="multipart/form-data" class="upload-form"><div><label for="file">이미지·문서 파일</label><input id="file" name="file" type="file" required accept=".jpg,.jpeg,.png,.pdf,.txt,.docx,.xlsx,.pptx,.hwp"><small class="muted">JPG·PNG·PDF·TXT·DOCX·XLSX·PPTX·HWP / 5MB 이하</small></div><div><label for="alt">이미지 설명</label><input id="alt" name="alt" maxlength="300" placeholder="이미지를 설명하는 대체 텍스트"></div><button>업로드</button></form></section>
<form class="search-form media-search" th:action="@{/admin/media}" method="get"><label class="sr-only" for="media-q">미디어 검색</label><input id="media-q" name="q" th:value="${query}" maxlength="100" placeholder="이름 또는 설명 검색"><button class="secondary">검색</button></form>
<div class="empty-state panel" th:if="${#lists.isEmpty(mediaItems)}"><h3>표시할 파일이 없습니다</h3><p>파일을 업로드하거나 검색 조건을 바꿔 보세요.</p></div>
<div class="media-library"><article class="panel media-card" th:each="m : ${mediaItems}"><div class="document-thumbnail" th:unless="${#strings.startsWith(m.mime,'image/')}">문서 첨부</div><img th:if="${#strings.startsWith(m.mime,'image/')}" th:src="@{/admin/media/{id}/file(id=${m.id})}" th:alt="${m.alt}" loading="lazy"><div class="media-card-body"><p class="muted" th:text="${(#strings.startsWith(m.mime,'image/') ? m.width+' × '+m.height+' · ' : '')+m.byteSize / 1024+' KB · '+m.ownerName}"></p><form th:action="@{/admin/media/{id}/edit(id=${m.id})}" method="post" data-unsaved><label th:for="'name-'+${m.id}">이름</label><input th:id="'name-'+${m.id}" name="name" th:value="${failedMediaId == m.id ? failedName : m.name}" maxlength="200" required><label th:if="${#strings.startsWith(m.mime,'image/')}" th:for="'alt-'+${m.id}">대체 텍스트</label><input th:type="${#strings.startsWith(m.mime,'image/') ? 'text' : 'hidden'}" th:id="'alt-'+${m.id}" name="alt" th:value="${failedMediaId == m.id ? failedAlt : m.alt}" maxlength="300"><button class="secondary small-button">정보 저장</button></form><a th:if="${canDeletePermanent}" th:href="@{/admin/media/{id}/delete-confirm(id=${m.id})}">파일 영구 삭제 검토</a></div></article></div><footer th:replace="~{fragments :: footer}"></footer></main></body></html>
