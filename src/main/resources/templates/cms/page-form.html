<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments :: head('페이지 편집')}"></head>
<body class="admin-layout writing-layout"><div th:replace="~{fragments :: header}"></div><main class="workspace" id="main-content">
<div class="page-heading"><div><h1>페이지 편집</h1></div><button type="button" class="secondary" data-focus-toggle aria-pressed="false">집중 모드</button></div>
<div th:replace="~{fragments :: messages}"></div>
<p class="muted" th:if="${pageId != null}">블록 복제와 표현 방식은 <a th:href="@{/admin-next/pages/{id}/edit(id=${pageId},view='manage')}">React 페이지 편집기</a>에서 변경할 수 있습니다. 여기서 저장해도 현재 표현 방식은 유지됩니다.</p>
<p class="muted" th:if="${pageId != null}"><a th:href="@{/admin-next/pages/{id}/edit(id=${pageId},view='manage',history='all')}" target="_blank" rel="noopener noreferrer">React에서 버전 이력 확인 ↗</a></p>
<form class="writing-form page-editor" th:action="@{/admin/pages/save}" method="post" data-page-editor data-writing-form data-kind="pages">
<input type="hidden" name="id" th:value="${pageId}"><input type="hidden" name="saveIntent" value="MANUAL_DRAFT">
<input type="hidden" name="revision" th:value="${revision}"><textarea id="sections-data" name="sectionsJson" hidden th:text="${sectionsJson}"></textarea>
<div class="writing-actions"><span class="publication-state" data-publication-state th:text="${pageStatus == 'PUBLISHED' ? (pending ? '발행본 있음 · 미반영 수정' : '발행본 있음') : pageStatus == 'PRIVATE' ? '비공개' : '임시저장'}"></span><span class="save-state" data-save-state role="status">자동 저장 대기</span><div><a class="button secondary" th:href="@{/admin/pages}">목록</a><button type="submit" name="action" value="save" class="secondary">임시저장</button><button type="submit" name="action" value="publish">발행본 저장</button></div></div>
<div class="writing-split"><section class="page-writing-column"><section class="panel writing-metadata"><label for="page-title">페이지 제목</label><input id="page-title" name="title" required maxlength="200" th:value="${title}" placeholder="예: 사관학교 소개"><input th:unless="${canManageSite}" type="hidden" name="slug" th:value="${slug}"><details th:if="${canManageSite}" class="advanced-fields"><summary>페이지 주소 설정</summary><label for="page-slug">주소 식별자</label><input id="page-slug" name="slug" maxlength="100" pattern="[a-z0-9]+(-[a-z0-9]+)*" th:value="${slug}" placeholder="자동 생성"><small class="muted">영문 소문자·숫자·하이픈</small></details></section>
<div class="section-add-bar"><strong>섹션 추가</strong><button type="button" class="secondary" data-add-section="HERO">＋ 대표 문구</button><button type="button" class="secondary" data-add-section="TEXT">＋ 본문</button><button type="button" class="secondary" data-add-section="IMAGE">＋ 이미지</button><button type="button" class="secondary" data-add-section="POSTS">＋ 글 목록</button><button type="button" class="secondary" data-add-section="CTA">＋ 안내 버튼</button></div><div data-sections></div><div class="empty-composer" data-sections-empty>위에서 첫 번째 섹션을 추가하세요.</div></section>
<aside class="live-preview panel"><div class="preview-heading"><div><span class="live-dot"></span><strong>실시간 미리보기</strong></div><div class="preview-tabs"><button type="button" data-preview-size="desktop" aria-pressed="true">PC</button><button type="button" data-preview-size="mobile" aria-pressed="false">모바일</button></div></div><div class="preview-scroll"><article class="preview-paper"><h1 data-preview-title>페이지 제목</h1><div data-live-sections></div></article></div></aside></div>

<template id="section-template"><article class="panel section-card" data-section><header class="section-card-head"><strong data-section-label></strong><div class="row-actions"><label class="check-label"><input type="checkbox" data-field="visible">표시</label><button type="button" class="icon-button" data-section-move="up" aria-label="섹션 위로">↑</button><button type="button" class="icon-button" data-section-move="down" aria-label="섹션 아래로">↓</button><button type="button" class="text-danger" data-section-remove>삭제</button></div></header>
<label>섹션 제목<input data-field="heading" maxlength="200" placeholder="섹션 제목"></label><div data-block-field="body"><div data-rich-editor data-label="섹션 본문"><textarea data-field="body" data-plain hidden></textarea><textarea data-field="bodyDoc" data-document hidden></textarea></div></div>
<label data-block-field="imageId">이미지<select data-field="imageId"><option value="">이미지 선택</option><option th:each="m : ${mediaItems}" th:if="${#strings.startsWith(m.mime,'image/')}" th:value="${m.id}" th:text="${m.name}"></option></select><span class="inline-upload"><input type="file" data-inline-image accept=".jpg,.jpeg,.png" aria-label="섹션 이미지 업로드"><span data-upload-message role="status"></span></span></label>
<label data-block-field="categoryId">표시할 글<select data-field="categoryId"><option value="">전체 카테고리</option><option th:each="c : ${categories}" th:value="${c.id}" th:text="${c.name}"></option></select></label>
<div class="field-row" data-block-field="link"><label>버튼 이름<input data-field="label" maxlength="80" placeholder="자세히 보기"></label><label>연결 주소<input data-field="link" maxlength="1000" placeholder="https://…"></label></div></article></template>
</form><div th:replace="~{editor-fragments :: tools}"></div><div th:replace="~{editor-fragments :: dialogs}"></div>
<div th:replace="~{editor-fragments :: documentActions('pages',${pageId},${pageStatus},${revision},'/admin/pages')}"></div><footer th:replace="~{fragments :: footer}"></footer></main></body></html>
