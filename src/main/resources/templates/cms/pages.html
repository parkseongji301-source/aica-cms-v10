<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments :: head('페이지 관리')}"></head>
<body class="admin-layout"><div th:replace="~{fragments :: header}"></div><main class="workspace" id="main-content">
<div class="page-heading"><div><h1>페이지 관리</h1></div><a th:if="${canManageSite}" class="button" th:href="@{/admin/pages/new}">＋ 새 페이지</a></div>
<div th:replace="~{fragments :: messages}"></div>
<section class="panel"><div class="table-summary"><h2>전체 페이지</h2><span class="count-pill" th:text="${#lists.size(pages)} + '개'"></span></div>
<div class="empty-state" th:if="${#lists.isEmpty(pages)}"><h3>등록된 페이지가 없습니다</h3><a th:if="${canManageSite}" class="button" th:href="@{/admin/pages/new}">새 페이지</a></div>
<div class="table-wrap" th:unless="${#lists.isEmpty(pages)}"><table><thead><tr><th>페이지</th><th>상태</th><th>수정일</th><th>관리</th></tr></thead><tbody><tr th:each="p : ${pages}"><td><a class="post-title" th:href="@{/admin/pages/{id}/edit(id=${p.id})}" th:text="${p.title}"></a><small class="muted" th:if="${p.pending()}">미반영 수정 있음</small></td><td><span class="status-pill" th:classappend="${p.status}" th:text="${p.status == 'PUBLISHED' ? '발행됨' : p.status == 'PRIVATE' ? '비공개' : '임시저장'}"></span></td><td th:text="${#temporals.format(p.updatedAt,'yyyy.MM.dd HH:mm')}"></td><td><a th:href="@{/admin/pages/{id}/edit(id=${p.id})}">편집</a></td></tr></tbody></table></div></section><footer th:replace="~{fragments :: footer}"></footer></main></body></html>
