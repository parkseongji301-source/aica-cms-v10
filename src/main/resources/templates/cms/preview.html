<!doctype html><html lang="ko" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments :: head('저장 내용 확인')}"></head><body class="admin-layout"><div th:replace="~{fragments :: header}"></div><main class="workspace" id="main-content"><div class="page-heading"><div><p class="eyebrow">CONTENT PREVIEW</p><h1>저장 내용 확인</h1><p class="page-description">백오피스 내부 확인 화면입니다. 실제 홈페이지는 아직 연결되지 않았습니다.</p></div></div><article class="panel preview-document"><h1 th:text="${pageTitle}"></h1><p th:if="${restaurant != null}" aria-label="맛집 주소"><strong>주소</strong> · <span th:text="${#strings.isEmpty(restaurant.address) ? '입력 없음' : restaurant.address}"></span></p><div class="rich-content" th:if="${bodyHtml != null}" th:utext="${bodyHtml}"></div><th:block th:if="${images != null}"><figure th:each="m : ${images}"><img class="preview-attachment" th:if="${#strings.startsWith(m.mime,'image/')}" th:src="@{/admin/media/{id}/file(id=${m.id})}" th:alt="${m.alt}"><a th:unless="${#strings.startsWith(m.mime,'image/')}" th:href="@{/admin/media/{id}/file(id=${m.id})}" th:text="${m.name}"></a><figcaption th:text="${m.alt}"></figcaption></figure></th:block><section class="preview-section" th:each="v : ${sections}" th:classappend="${'type-' + #strings.toLowerCase(v.section.type) + ' variation-' + v.section.variation}" th:attr="data-block-id=${v.section.id}"><h2 th:text="${v.section.heading}"></h2><div class="rich-content" th:utext="${@richText.html(v.section.bodyDoc,v.section.body)}"></div><img class="preview-attachment" th:if="${v.section.imageId != null}" th:src="@{/admin/media/{id}/file(id=${v.section.imageId})}" alt="섹션 이미지"><div th:if="${v.section.type == 'POSTS'}"><p>발행 콘텐츠 · 총 <span th:text="${v.total}"></span>건</p><p th:if="${#lists.isEmpty(v.posts)}">조건에 맞는 발행 콘텐츠가 없습니다.</p><ol><li th:each="post : ${v.posts}" th:text="${post.title}"></li></ol></div><span class="preview-cta" th:if="${!#strings.isEmpty(v.section.label)}" th:text="${v.section.label}"></span></section></article></main></body></html>
