<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments :: head('설정')}"></head>
<body class="admin-layout"><div th:replace="~{fragments :: header}"></div><main class="workspace" id="main-content">
<div class="page-heading"><h1 th:text="${group == 'design' ? '디자인 설정' : '기본 정보'}"></h1></div>
<section class="panel form-panel settings-form"><div th:replace="~{fragments :: messages}"></div><form th:action="@{/admin/settings/save/{group}(group=${group})}" method="post" data-unsaved>
<th:block th:if="${group == 'basic'}"><label for="site-name">사이트 이름</label><input id="site-name" name="siteName" required maxlength="80" th:value="${settings.siteName}"><label for="description">사이트 소개</label><textarea id="description" name="description" maxlength="500" rows="3" th:text="${settings.description}"></textarea><label for="contact-email">문의 이메일</label><input id="contact-email" name="contactEmail" type="email" maxlength="254" th:value="${settings.contactEmail}"><div class="field-row"><label for="home-page">첫 화면<select id="home-page" name="homePageId"><option value="">글 목록</option><option th:each="p : ${pages}" th:if="${p.status == 'PUBLISHED'}" th:value="${p.id}" th:text="${p.title}" th:selected="${settings.homePageId == #strings.toString(p.id)}"></option></select></label><label for="posts-per-page">목록당 글 수<select id="posts-per-page" name="postsPerPage"><option value="6" th:selected="${settings.postsPerPage == '6'}">6개</option><option value="12" th:selected="${settings.postsPerPage == '12'}">12개</option><option value="24" th:selected="${settings.postsPerPage == '24'}">24개</option></select></label></div></th:block>
<th:block th:if="${group == 'design'}"><h2>색상과 모양</h2><div class="field-row"><label>강조색<input type="color" name="primaryColor" th:value="${settings.primaryColor}"></label><label>상단 배경색<input type="color" name="headerColor" th:value="${settings.headerColor}"></label></div><label for="radius">모서리</label><select id="radius" name="radius"><option value="0" th:selected="${settings.radius == '0'}">직각</option><option value="8" th:selected="${settings.radius == '8'}">조금 둥글게</option><option value="12" th:selected="${settings.radius == '12'}">기본</option><option value="20" th:selected="${settings.radius == '20'}">둥글게</option></select>
<hr><h2>로고와 상단·하단</h2><div data-image-picker><label for="logo">로고</label><select id="logo" name="logoId" data-image-select><option value="">사이트 이름 사용</option><option th:each="m : ${mediaItems}" th:if="${#strings.startsWith(m.mime,'image/')}" th:value="${m.id}" th:text="${m.name}" th:selected="${settings.logoId == #strings.toString(m.id)}"></option></select><img class="picked-image" data-picked-image th:hidden="${#strings.isEmpty(settings.logoId)}" th:src="${#strings.isEmpty(settings.logoId) ? null : '/admin/media/'+settings.logoId+'/file'}" alt="선택한 로고"><label class="inline-upload">새 로고 업로드<input type="file" data-inline-image accept=".jpg,.jpeg,.png"><span data-upload-message role="status"></span></label></div>
<label for="header-note">상단 문구</label><input id="header-note" name="headerNote" maxlength="120" th:value="${settings.headerNote}"><label for="footer-text">하단 문구</label><textarea id="footer-text" name="footerText" maxlength="500" rows="3" th:text="${settings.footerText}"></textarea></th:block>
<div class="form-actions"><button>저장</button></div></form></section><footer th:replace="~{fragments :: footer}"></footer></main></body></html>
