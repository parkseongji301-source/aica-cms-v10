<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments :: head('항목 관리')}"></head>
<body class="admin-layout"><div th:replace="~{fragments :: header}"></div><main class="workspace" id="main-content">
<div class="page-heading"><h1 th:text="${structure == 'categories' ? '카테고리 관리' : structure == 'menus' ? '메뉴 설정' : 'SNS / 외부 링크'}"></h1></div>
<div class="settings-grid"><section class="panel"><div class="table-summary"><h2 th:text="${structure == 'categories' ? '카테고리' : structure == 'menus' ? '홈페이지 메뉴' : 'SNS / 외부 링크'}"></h2><span class="count-pill" th:text="${#lists.size(items)}+'개'"></span></div>
<form th:action="@{/admin/structure/{type}/order(type=${structure})}" method="post" data-reorder data-unsaved><div data-order-items>
<article class="order-row" th:each="entry : ${items}"><input type="hidden" name="ids" th:value="${entry.id}"><div class="order-controls"><button type="button" class="icon-button" data-move="up" th:disabled="${entryStat.first}" th:attr="aria-label=${(structure == 'categories' ? entry.name : entry.label)+' 위로 이동'}">↑</button><button type="button" class="icon-button" data-move="down" th:disabled="${entryStat.last}" th:attr="aria-label=${(structure == 'categories' ? entry.name : entry.label)+' 아래로 이동'}">↓</button></div>
<div class="order-label"><strong th:text="${structure == 'categories' ? entry.name : entry.label}"></strong><small class="muted" th:if="${structure == 'links'}" th:text="${entry.url}"></small><small class="muted" th:if="${structure == 'menus'}" th:text="${(entry.kind == 'PAGE' ? '페이지' : entry.kind == 'CATEGORY' ? '카테고리' : '외부 링크')+' · '+(entry.visible ? '표시' : '숨김')}"></small></div>
<div class="row-actions"><a th:href="@{__${base}__(edit=${entry.id})}">수정</a><button type="submit" class="text-danger" th:form="'delete-'+${entry.id}">삭제</button></div></article></div>
<div class="panel-bottom" th:unless="${#lists.isEmpty(items)}"><button class="secondary" data-order-save disabled>순서 저장</button><small class="muted" data-order-status role="status"></small></div></form>
<form th:each="entry : ${items}" th:id="'delete-'+${entry.id}" th:action="@{__${base}__/{id}/delete(id=${entry.id})}" method="post" th:attr="data-confirm=${'‘'+(structure == 'categories' ? entry.name : entry.label)+'’ 항목을 삭제할까요?'}"></form>
<div class="empty-state" th:if="${#lists.isEmpty(items)}">등록된 항목이 없습니다.</div></section>
<section class="panel form-panel"><h2 th:text="${editId == null ? (structure == 'categories' ? '카테고리 추가' : structure == 'menus' ? '메뉴 추가' : '링크 추가') : '수정'}"></h2><div th:replace="~{fragments :: messages}"></div>
<form th:action="@{__${base}__}" method="post" data-menu-form data-unsaved><input type="hidden" name="id" th:value="${editId}">
<label th:if="${structure == 'categories'}" for="category-name">카테고리 이름<input id="category-name" name="name" required maxlength="80" th:value="${formValues['name']}"></label>
<th:block th:if="${structure == 'menus'}"><label for="destination">메뉴에 넣을 항목</label><select id="destination" name="destination" required data-menu-destination><option value="">선택하세요</option><optgroup label="페이지"><option th:each="p : ${pages}" th:value="'PAGE:'+${p.id}" th:text="${p.title} + ${p.status == 'PUBLISHED' ? '' : ' (미발행)'}" th:selected="${formValues['destination'] == 'PAGE:'+p.id}"></option></optgroup><optgroup label="카테고리"><option th:each="c : ${categories}" th:value="'CATEGORY:'+${c.id}" th:text="${c.name}" th:selected="${formValues['destination'] == 'CATEGORY:'+c.id}"></option></optgroup><option value="LINK" th:selected="${formValues['destination'] == 'LINK'}">외부 링크</option></select></th:block>
<div th:if="${structure != 'categories'}" data-link-fields><label for="item-name">이름</label><input id="item-name" name="label" required maxlength="80" th:value="${formValues['label']}"><label for="item-url">연결 주소</label><input id="item-url" name="url" required maxlength="1000" th:value="${formValues['url']}" placeholder="https://…"></div>
<label th:if="${structure == 'menus'}" class="check-label"><input type="checkbox" name="visible" value="true" th:checked="${formValues['visible'] == 'true'}">메뉴에 표시</label>
<div class="form-actions"><button th:text="${editId == null ? '추가' : '저장'}"></button><a th:if="${editId != null}" th:href="@{__${base}__}">취소</a></div></form></section></div><footer th:replace="~{fragments :: footer}"></footer></main></body></html>
