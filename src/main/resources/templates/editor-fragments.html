<!doctype html><html lang="ko" xmlns:th="http://www.thymeleaf.org"><body>
<template th:fragment="tools" id="rich-tools"><div class="rich-toolbar" role="toolbar" aria-label="본문 서식 도구">
<div class="toolbar-row"><select data-format="header" aria-label="문단 스타일"><option value="">본문</option><option value="1">제목 1</option><option value="2">제목 2</option><option value="3">제목 3</option></select><select data-format="font" aria-label="글꼴"><option value="">기본 고딕</option><option value="serif">명조</option><option value="mono">고정폭</option></select><select data-format="size" aria-label="글자 크기"><option value="small">작게 · 14</option><option value="">보통 · 16</option><option value="large">크게 · 20</option><option value="huge">아주 크게 · 28</option></select><span class="toolbar-divider"></span><button type="button" data-format="bold" aria-label="굵게" title="굵게 (Ctrl+B)"><b>B</b></button><button type="button" data-format="italic" aria-label="기울임"><i>I</i></button><button type="button" data-format="underline" aria-label="밑줄"><u>U</u></button><button type="button" data-format="strike" aria-label="취소선"><s>S</s></button><select data-format="color" aria-label="글자색"><option value="">글자색</option><option value="navy">남색</option><option value="blue">파랑</option><option value="teal">청록</option><option value="red">빨강</option><option value="purple">보라</option><option value="gray">회색</option><option value="white">흰색</option></select><select data-format="background" aria-label="글자 배경색"><option value="">배경색</option><option value="yellow">노랑</option><option value="blue">파랑</option><option value="teal">청록</option><option value="gray">회색</option></select></div>
<div class="toolbar-row"><select data-format="align" aria-label="문단 정렬"><option value="">왼쪽 정렬</option><option value="center">가운데 정렬</option><option value="right">오른쪽 정렬</option><option value="justify">양쪽 정렬</option></select><button type="button" data-format="list" data-value="bullet" aria-label="글머리 목록">• 목록</button><button type="button" data-format="list" data-value="ordered" aria-label="번호 목록">1. 목록</button><button type="button" data-format="blockquote" aria-label="인용문">“ 인용</button><button type="button" data-format="code-block" aria-label="코드 블록">&lt;/&gt;</button><span class="toolbar-divider"></span><button type="button" data-action="link">링크</button><button type="button" data-action="table">표</button><button type="button" data-action="divider">구분선</button><button type="button" data-action="upload" class="toolbar-accent">＋ 사진·파일</button><button type="button" data-action="library">보관함</button><button type="button" data-action="clean" aria-label="서식 지우기">서식 지우기</button><button type="button" data-action="undo" aria-label="실행 취소">↶</button><button type="button" data-action="redo" aria-label="다시 실행">↷</button></div><input type="file" data-editor-upload hidden multiple accept=".jpg,.jpeg,.png,.pdf,.txt,.docx,.xlsx,.pptx,.hwp"><div class="editor-message" data-editor-message role="status" hidden></div></div></template>
<div th:fragment="dialogs">
<dialog class="editor-dialog" data-library-dialog><div class="dialog-heading"><h2>미디어 보관함</h2><button type="button" data-close-dialog aria-label="보관함 닫기">×</button></div><label class="library-upload">파일 업로드<input type="file" data-library-upload multiple accept=".jpg,.jpeg,.png,.pdf,.txt,.docx,.xlsx,.pptx,.hwp"></label><input type="search" data-library-search aria-label="보관함 검색" placeholder="파일 이름 검색"><div class="library-items"><button type="button" th:each="m : ${mediaItems}" class="library-item" th:attr="data-media-id=${m.id},data-name=${m.name},data-alt=${m.alt},data-mime=${m.mime}"><img th:if="${#strings.startsWith(m.mime,'image/')}" th:src="@{/admin/media/{id}/file(id=${m.id})}" th:alt="${m.alt}" loading="lazy"><span th:unless="${#strings.startsWith(m.mime,'image/')}" class="file-symbol">문서 ↓</span><span th:text="${m.name}"></span></button></div><p th:if="${#lists.isEmpty(mediaItems)}" class="muted" data-library-empty>등록된 파일이 없습니다.</p></dialog>
<dialog class="editor-dialog compact-dialog" data-link-dialog><form method="dialog"><h2>링크 넣기</h2><label for="link-url">연결 주소</label><input id="link-url" type="url" required placeholder="https://" maxlength="1000"><label for="link-label">표시할 문구</label><input id="link-label" maxlength="300" placeholder="선택한 글 또는 주소"><div class="form-actions"><button type="button" class="secondary" data-close-dialog>취소</button><button value="ok">적용</button></div></form></dialog>
<dialog class="editor-dialog compact-dialog" data-embed-dialog><form method="dialog"><h2 data-embed-title>사진 설정</h2><div data-image-options><div class="field-row"><label>사진 크기<select data-image-width><option value="100">본문 너비 100%</option><option value="75">75%</option><option value="50">50%</option><option value="25">25%</option></select></label><label>사진 정렬<select data-image-align><option value="left">왼쪽</option><option value="center">가운데</option><option value="right">오른쪽</option></select></label></div><label>대체 텍스트<input data-image-alt maxlength="300" placeholder="이미지를 설명하는 문구"></label><label>사진 설명<input data-image-caption maxlength="300" placeholder="사진 아래에 표시할 설명"></label></div><label data-file-options>파일 표시 이름<input data-file-label maxlength="200" required></label><div class="embed-move"><button type="button" class="secondary" data-embed-move="up">↑ 위로 이동</button><button type="button" class="secondary" data-embed-move="down">↓ 아래로 이동</button><button type="button" class="text-danger" data-embed-remove>본문에서 제거</button></div><div class="form-actions"><button type="button" class="secondary" data-close-dialog>닫기</button><button value="ok">설정 적용</button></div></form></dialog>
<dialog class="editor-dialog" data-table-dialog><form method="dialog"><h2>표 편집</h2><p class="muted">셀에 내용을 입력하세요. 삽입한 표를 누르면 다시 편집할 수 있습니다.</p><div class="table-size"><label>행<input type="number" data-table-rows min="1" max="20" value="3"></label><label>열<input type="number" data-table-cols min="1" max="8" value="3"></label><button type="button" class="secondary" data-table-resize>크기 적용</button></div><div class="table-inputs" data-table-grid></div><div class="form-actions"><button type="button" class="secondary" data-close-dialog>취소</button><button value="ok">표 적용</button></div></form></dialog>
</div><div th:fragment="documentActions(kind,id,status,revision,returnTo)" class="document-actions" data-document-actions th:hidden="${id == null}">
<a th:if="${kind == 'posts'}" data-publication-link th:hidden="${status != 'PUBLISHED'}" th:href="@{/admin/legacy/posts/{id}/publication(id=${id ?: 0})}" target="_blank" rel="noopener">발행본 확인 ↗</a>
<details><summary>더 보기</summary><div class="document-action-menu">
<form th:if="${canPublish}" data-document-action="unpublish" th:hidden="${status != 'PUBLISHED'}" th:action="@{/admin/{kind}/{id}/unpublish(kind=${kind},id=${id ?: 0})}" method="post" data-confirm="저장된 발행본을 비공개로 전환할까요?"><input type="hidden" name="revision" th:value="${revision}"><input type="hidden" name="from" th:value="${returnTo}"><button class="secondary">공개 중단</button></form>
<a th:if="${canDeletePermanent}" class="text-danger" data-delete-review th:href="@{/admin/legacy/{kind}/{id}/delete-confirm(kind=${kind},id=${id ?: 0})}" th:text="${kind == 'posts'} ? '휴지통 이동 검토' : '영구 삭제 검토'">삭제 검토</a>
</div></details></div></body></html>
