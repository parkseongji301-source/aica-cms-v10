<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments :: head('글쓰기·수정')}"></head>
<body class="admin-layout writing-layout"><div th:replace="~{fragments :: header}"></div><main class="workspace" id="main-content">
<div class="page-heading"><div><h1 th:text="${editing ? '글 수정' : '글쓰기'}"></h1></div><button type="button" class="secondary" data-focus-toggle aria-pressed="false">집중 모드</button></div>
<div th:replace="~{fragments :: messages}"></div>
<section class="notice" th:if="${classification != null}" aria-label="현재 초안 분류">
<p><strong>초안 분류</strong> · <span th:text="${classification.typeName}"></span>
 · 기수: <span th:if="${#lists.isEmpty(classification.cohorts)}">없음</span><span th:each="term,item : ${classification.cohorts}" th:text="${term.name + (item.last ? '' : ', ')}"></span>
 · 주제: <span th:if="${#lists.isEmpty(classification.topics)}">없음</span><span th:each="term,item : ${classification.topics}" th:text="${term.name + (item.last ? '' : ', ')}"></span>
 · <a th:href="@{/admin-next/posts/{id}/edit(id=${postId},view='manage')}" target="_blank" rel="noopener noreferrer">유형·기수·주제 편집 ↗</a></p>
</section>
<section class="notice" th:if="${restaurant != null}" aria-label="현재 초안 주소"><p><strong>맛집 주소</strong> · <span th:text="${#strings.isEmpty(restaurant.address) ? '입력 없음' : restaurant.address}"></span> · <a th:href="@{/admin-next/posts/{id}/edit(id=${postId},view='manage')}" target="_blank" rel="noopener noreferrer">주소 편집 ↗</a></p></section>
<p class="muted" th:if="${postId != null}"><a th:href="@{/admin-next/posts/{id}/edit(id=${postId},view='manage',history='all')}" target="_blank" rel="noopener noreferrer">React에서 버전 이력 확인 ↗</a></p>
<form class="writing-form" th:action="${editing} ? @{/admin/posts/{id}/edit(id=${postId})} : @{/admin/posts}" method="post" data-writing-form data-kind="posts">
<input type="hidden" name="from" th:value="${returnTo}"><input type="hidden" name="id" th:value="${postId}"><input type="hidden" name="saveIntent" value="MANUAL_DRAFT">
<input type="hidden" name="revision" th:value="${revision}">
<div class="writing-actions"><span class="publication-state" data-publication-state th:text="${postStatus == 'PUBLISHED' ? (pending ? '발행본 있음 · 미반영 수정' : '발행본 있음') : postStatus == 'PRIVATE' ? '비공개' : '임시저장'}"></span><span class="save-state" data-save-state role="status">자동 저장 대기</span><div><a class="button secondary" th:href="${returnTo}">목록</a><button type="submit" name="action" value="save" class="secondary">임시저장</button><button th:if="${canPublish}" type="submit" name="action" value="publish">발행본 저장</button></div></div>
<div class="writing-split"><section class="writing-canvas panel"><div class="writing-metadata"><label for="categoryId">카테고리</label><select id="categoryId" name="categoryId"><option value="">분류 없음</option><option th:each="c : ${categories}" th:value="${c.id}" th:text="${c.name}" th:selected="${categoryId == c.id}"></option></select><label class="sr-only" for="title">제목</label><input class="writing-title" id="title" name="title" th:value="${title}" required maxlength="200" placeholder="제목을 입력하세요"></div>
<div data-rich-editor data-label="콘텐츠 본문"><textarea name="content" data-plain hidden th:text="${content}"></textarea><textarea name="richContent" data-document hidden th:text="${richContent}"></textarea></div>
<div hidden data-legacy-media><span th:each="m : ${mediaItems}" th:if="${#lists.contains(selectedMedia,m.id)}" th:attr="data-id=${m.id},data-name=${m.name},data-alt=${m.alt},data-mime=${m.mime}"></span></div>
<div class="writing-foot"><span>사진 드래그·붙여넣기 지원 · 파일 최대 12개</span><span data-word-count>0자</span></div></section>
<aside class="live-preview panel"><div class="preview-heading"><div><span class="live-dot"></span><strong>실시간 미리보기</strong></div><div class="preview-tabs"><button type="button" data-preview-size="desktop" aria-pressed="true">PC</button><button type="button" data-preview-size="mobile" aria-pressed="false">모바일</button></div></div><div class="preview-scroll"><article class="preview-paper"><p class="preview-category" data-preview-category></p><h1 data-preview-title>제목을 입력하세요</h1><div data-live-post></div></article></div></aside></div>

</form><div th:replace="~{editor-fragments :: documentActions('posts',${postId},${postStatus},${revision},${returnTo})}"></div><div th:replace="~{editor-fragments :: tools}"></div><div th:replace="~{editor-fragments :: dialogs}"></div><footer th:replace="~{fragments :: footer}"></footer></main></body></html>
